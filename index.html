<header><h1>🧭 Намальск / библиотека игрока</h1><div class="muted">38 памяток · отдельные тексты для Discord · карты и крупные планы · 12.11.2026</div><a href="Карты/Намальск_карта_игрока.html">Открыть интерактивную карту ↗</a></header><main><aside><input id="search" placeholder="Найти гайд…" aria-label="Поиск гайда"><div id="nav"></div></aside><article><div class="tools"><button id="copy">Скопировать для Discord</button><a id="source">Отдельный файл</a><span id="status"></span></div><div id="notice"></div><div id="body"></div><div id="images"></div></article></main><script>
const guides=[{"title": "🧭 Первые шаги на Намальске", "text": "# 🧭 Первые шаги на Намальске\n**Сначала согрейся, затем думай о добыче.**\n\n1. При появлении выбери доступную точку в окне возрождения. Возможность выбора зависит от таймера и доступных тебе вариантов.\n2. Осмотри стартовые вещи. Береги еду, воду и источники тепла; мокрая одежда особенно опасна на холоде.\n3. Проверь назначенные клавиши модов в настройках управления. Не все действия используют стандартные кнопки DayZ.\n4. Найди торговца и познакомься с банковским счётом. Основные услуги оплачиваются игровыми рублями.\n\n**Полезные ориентиры**\n• Гаражи находятся у заправок; точки показаны на карте к гайду о гаражах.\n• Глобальный чат слышит весь сервер. Клановый канал предназначен для участников клана.\n• Обращение к администрации можно создать через систему тикетов.\n\n> Это PvP-сервер: редкое снаряжение, машина и содержимое рюкзака могут быть потеряны. Подбирай маршрут и запас припасов под задачу.\n\n### PvP и PvE\n**PvP** — бой между игроками. **PvE** — борьба с окружением: холодом, заражёнными и мутантами. Здесь обе угрозы действуют вместе; безопасный фарм не является основой сервера.\n\nИнститут Athena (Tier 4) — место борьбы за хорошее оружие, броню и экипировку SFP. Такие находки там предусмотрены: за ними идут с риском встретить соперников. Основной денежный запас собирают на транспорт, взрывчатку и услуги; обычную экипировку преимущественно находят в мире.\n", "path": "Тексты_на_проверку/01_Первый_вход.md", "later": false, "images": []}, {"title": "🚗 Гаражи у заправок", "text": "# 🚗 Гаражи у заправок\n**Личное хранилище — до 5 машин.** Гаражники оформлены в маскарадный костюм военной девушки SFP.\n\n### Как поставить машину\n1. Подъедь к точке гаража: транспорт должен быть в пределах **25 м**.\n2. Заглуши двигатель. Все пассажиры и водитель должны выйти.\n3. Подойди к NPC, выбери действие **«Гараж»**, затем **«Поставить»**.\n\n### Как получить обратно\nВыбери сохранённую машину и нажми **«Забрать»**. Площадка выдачи должна быть свободна.\n\n• Постановка — **1 000 игровых ₽**.\n• Выдача — **500 игровых ₽**.\n• Заправка — **25 игровых ₽/л**.\n• Оплата — с банковского счёта. Ремонт выключен.\n\nПроверяется право владельца; уничтоженные машины на хранение не принимаются. Багаж настроен на сохранение. Клановое хранилище находится отдельно от личного.\n\n> Получить машину можно в другом гараже: хранение не привязано к месту сдачи.\n\n🗺️ Все восемь точек и их увеличенные фрагменты — на приложенных картах.\n", "path": "Тексты_на_проверку/02_Гаражи.md", "later": false, "images": ["Гаражи_обзор.png", "Гаражи_крупно_1.png", "Гаражи_крупно_2.png"]}, {"title": "🔐 Защита машин и угон", "text": "# 🔐 Защита машин и угон\n**Защищай транспорт и проверяй багажник перед уходом.**\n\nДля регистрации защиты установи рабочие основные детали и хотя бы раз запусти двигатель. Дальнейшее управление — через действия иммобилайзера у машины. Доступ выдаётся по коду и списку допущенных; отдельные предметы-ключи выключены.\n\n• Лимит регистрации — **3 защищённые машины на игрока**. Это отдельный лимит от пяти мест личного гаража.\n• Автозакрытие настроено через **5 минут**; оставшийся внутри пассажир откладывает срабатывание.\n• На открытой машине посторонний может уехать и взять груз.\n• Открытая или снятая крышка багажника позволяет посторонним добраться до груза даже при включённом замке.\n\n### Взлом\nВне безопасных зон доступен круглосуточно. В безопасных зонах взлом запрещён.\n\n• **Отмычка:** 5 минут, шанс успеха 70%.\n• **Лом:** 8 минут, шанс 40%.\n• **Кувалда:** 7 минут, шанс 50%.\n\nПопытка включает сигнализацию. Инструмент изнашивается; грубый взлом способен повредить детали. Проценты относятся к одной попытке, успех не гарантирован.\n\n> Запрет взлома не мешает уехать на уже открытой машине. Не оставляй её открытой даже на сейфе.\n", "path": "Тексты_на_проверку/03_Защита_машин_и_угон.md", "later": false, "images": []}, {"title": "🏪 Торговцы и банковский счёт", "text": "# 🏪 Торговцы и банковский счёт\n**Основная валюта сервера — игровые рубли.**\n\n1. Подойди к нужному торговцу и открой торговлю.\n2. Выбери покупку или продажу, проверь количество и итоговую сумму.\n3. Подтверди операцию. Основные NPC используют банковскую оплату.\n\nЦена зависит от предложения, наличия товара и действующих торговых условий. Смотри сумму в окне перед подтверждением: старый скриншот цены не фиксирует её навсегда.\n\n### Банк\nИспользуй банковский терминал для доступных операций со счётом. Перед переводом перепроверь получателя, сумму и комиссию. Клановая казна и личный банковский счёт — разные источники средств.\n\n### Если товар недоступен\nПроверь остаток, лимит покупки и требования товара. Отсутствие предмета у одного торговца не означает, что он обязан появиться у другого.\n\n> Названия и расположение торговых точек уточняются на карте после окончательной расстановки NPC. Новости рынка публикуются в отдельном канале Discord.\n", "path": "Тексты_на_проверку/04_Трейдеры_и_банк.md", "later": false, "images": []}, {"title": "🤝 Рынок между игроками", "text": "# 🤝 Рынок между игроками\n**Торгуй игровыми предметами за игровые рубли.** Это отдельная система от магазина поддержки проекта.\n\nОткрой рыночный раздел клановой системы, проверь доступные предложения или выставь свой лот, если твоя роль позволяет это сделать.\n\n• До **10 лотов на клан**.\n• Максимальная цена — **1 000 000 ₽**.\n• Комиссия выставления — **5%**; торговая комиссия — **5%**.\n• Отмена доступна не ранее чем через **60 минут**.\n• Штраф отмены — **10%**, задержка возврата — **15 минут**.\n\nПеред продажей проверь, что вещь разрешена для обмена, а цена и комплектность указаны правильно. Доступ к продаже зависит от кланового ранга.\n\n> Не путай комиссию выставления с комиссией завершённой продажи. Итоговые суммы проверяй в подтверждении операции.\n", "path": "Тексты_на_проверку/05_Рынок_между_игроками.md", "later": false, "images": []}, {"title": "🔨 Аукцион вещей", "text": "# 🔨 Аукцион вещей\n**Побеждает лучшая действующая ставка к окончанию торгов.**\n\nВ разделе аукциона выбери лот, изучи вещь, текущую цену и срок. Для своей продажи укажи стартовую цену и длительность, затем проверь комиссию.\n\n• До **5 активных лотов на игрока**.\n• Длительность — от **30 минут до 24 часов**.\n• Минимальный шаг ставки — **100 ₽**.\n• Стартовая цена — не более **1 000 000 ₽**.\n• Выставление — **5%**, налог продажи — **5%**.\n\nСтавка в последние **30 секунд** продлевает торги на **60 секунд**.\n\nСнять свой лот разрешено без ставок и не ранее чем через час. Штраф отмены — **10%**, возврат занимает **15 минут**. Если ставок нет, предмет настроен на возврат владельцу.\n\n> Перед ставкой оцени вещь и конечную сумму. Поздняя ставка не гарантирует немедленного окончания торгов.\n", "path": "Тексты_на_проверку/06_Аукцион.md", "later": false, "images": []}, {"title": "📡 Контрабандист — рискованная доставка", "text": "# 📡 Контрабандист — рискованная доставка\n**Ты оплачиваешь груз, но забрать его может другой игрок.**\n\n1. Подготовь планшет и батарейку 9V.\n2. Выбери доступный товар и способ оплаты, проверь заказ.\n3. Дождись доставки и найди контейнер по оповещению.\n4. После снятия таймерного замка пройди мини-игру вскрытия.\n\n### Условия\n• Не более **1 заказа в сутки**, дополнительно действует пауза **24 часа**.\n• Груз появляется в **300–2 000 м** от заказчика.\n• Доставка вертолётом — около **3 минут**, катером — около **3 минут 20 секунд**.\n• Замок контейнера — **8 минут**; мини-игра — **45 секунд**.\n• После ошибки — пауза **20 секунд**.\n\nО заказе узнаёт сервер. Вскрывать может любой; личное успешное вскрытие заказчиком повышает доверие. Помощь соклановца не начисляет доверие заказчику автоматически.\n\nОтмена во время доставки возвращает **50%**. Кража и истечение срока не дают возврата. На извлечение после таймерного замка отведено **20 минут**, после открытия контейнер очищается через **10 минут**.\n\n**Доверие:** после 4 / 9 / 15 личных успешных заказов открываются ступени со скидкой 5 / 10 / 15%.\n\n> Контрабандная доставка, аирдроп и конвой — три разных события.\n", "path": "Тексты_на_проверку/07_Контрабандист.md", "later": false, "images": []}, {"title": "🛡️ Кланы и роли", "text": "# 🛡️ Кланы и роли\n**Клан объединяет людей, общую связь и совместные задачи.**\n\nОткрой меню клановой системы. Найди подходящий клан и подай заявку либо создай свой через доступный раздел. Приглашение действительно **3 минуты**.\n\n• До **10 участников**.\n• Название — **3–24 символа**, тег — до **6 символов**.\n• Приглашать, исключать, продавать и управлять ресурсами могут только роли с соответствующим доступом.\n\nОбщий чат клана, карта, метки, казна и склад помогают действовать вместе. Наличие клана само по себе не даёт всем участникам одинаковые полномочия.\n\n**Огонь по своим не заблокирован для всех кланов.** Учитывай положение союзников и не проверяй оружие выстрелом в напарника.\n\n> Клан, зарегистрированный приват базы и захваченная территория ClanWar — разные сущности. Создание клана не заменяет регистрацию базы.\n", "path": "Тексты_на_проверку/08_Кланы.md", "later": false, "images": []}, {"title": "🧰 Казна и клановое хранение", "text": "# 🧰 Казна и клановое хранение\n**Общие ресурсы требуют аккуратного распределения прав.**\n\nКазна находится в клановой системе. Перед оплатой проверь, какой источник выбран: личные деньги и средства клана не взаимозаменяются автоматически.\n\nДля работы со складом открой соответствующий раздел у доступной клановой точки. Радиус обслуживания склада настроен на **30 м**. Возможность забрать или положить вещи зависит от прав участника.\n\n### Клановый гараж\nЭто отдельное хранилище транспорта. Его базовая вместимость — **4 места**, прирост — **2 места за уровень клана**. Доступ определяется клановыми разрешениями; операции настроены на оплату казной.\n\nЛичные пять мест гаража не превращаются в пять общих мест для каждого участника.\n\n> Перед назначением офицера проверь выданные ему полномочия. Доступ к общим вещам и деньгам — ответственность клана.\n", "path": "Тексты_на_проверку/09_Казна_и_клановое_хранение.md", "later": false, "images": []}, {"title": "🧑‍🤝‍🧑 Друзья, поиск группы и метки", "text": "# 🧑‍🤝‍🧑 Друзья, поиск группы и метки\n**Для совместного выхода не обязательно сразу создавать клан.**\n\nВ разделе друзей найди игрока и отправь запрос. Список вмещает **50 друзей**; запрос действует до **72 часов**. Доступны личные сообщения и уведомления о появлении друзей.\n\n### Поиск группы\nСоздай объявление, опиши цель и нужное число участников. Объявление действует **30 минут**, запросить можно до **6 человек**. Комментарий — до **80 символов**.\n\n### Клановая карта\nУ клана доступно до **30 меток**. Название метки — до **32 символов**. Тактический план действует **60 минут** и позволяет до **40 фигур**.\n\nБыстрая отметка держится **30 секунд** и показывает дистанцию. Назначенную клавишу проверь в настройках управления.\n\n> Перед движением сверяйте название точки и направление. Метка на карте не означает, что район безопасен.\n", "path": "Тексты_на_проверку/10_Друзья_группы_и_метки.md", "later": false, "images": []}, {"title": "🎯 Контракты игроков", "text": "# 🎯 Контракты игроков\n**Сначала изучи задачу и условия, затем принимай заказ.**\n\nОткрой раздел контрактов клановой системы. В карточке проверь цель, срок, награду и доступные условия выполнения. Создавать заказы могут игроки с необходимым званием.\n\n• Стоимость — **1 000–1 000 000 игровых ₽**.\n• Срок — **30 минут–24 часа**.\n• Не более **3 созданных** и **1 принятого** активного контракта на игрока.\n• Комиссия — **10%**.\n• Штраф отказа от принятого контракта — **20%**.\n\nДля контрактов с отображением цели информация обновляется с интервалом, а не непрерывно. Не воспринимай метку как точное положение цели в каждую секунду.\n\n> Выполняй именно требования карточки. Обычное убийство или передача похожей вещи не гарантируют завершения контракта.\n", "path": "Тексты_на_проверку/11_Контракты.md", "later": false, "images": []}, {"title": "🚩 Регистрация и содержание базы", "text": "# 🚩 Регистрация и содержание базы\n**Флаг нужно зарегистрировать и вовремя продлевать.**\n\nУстанови разрешённый флагшток и открой доступное действие территории у него. Проверь место, название, будущую границу и стоимость до регистрации.\n\n• Регистрация — **10 000 игровых ₽**, первые **7 дней** включены.\n• Продление — **25 ₽/час**, то есть **600 ₽/сутки**.\n• Оплата — с личного банковского счёта.\n• Продление ручное; срок можно довести до **7 дней вперёд**.\n• Предупреждения приходят за **сутки** и за **3 часа**.\n\nРадиус начинается с **30 м**. Улучшения до 35 и 40 м стоят **15 000** и **25 000 ₽**. Дополнительный флаг сам по себе не расширяет зарегистрированный приват.\n\n### Не пропускай оплату\nПри истечении срока настроено удаление флага и учитываемых построек, мебели и хранилищ **с содержимым**. Простого присутствия владельца для бесплатного продления недостаточно.\n\n> До оплаты и строительства внимательно проверь границу. На склонах важны также высота и глубина территории.\n", "path": "Тексты_на_проверку/12_Приват_базы.md", "later": false, "images": []}, {"title": "🧱 Строительство и лимиты базы", "text": "# 🧱 Строительство и лимиты базы\n**Основное строительство разрешено внутри зарегистрированного привата.**\n\nПроверяй подсказку размещения перед установкой предмета. Если объект не ставится, проверь границу, доступ участника, препятствия и лимит его группы.\n\n### Основные ограничения\n• Ванильные секции забора/ворот — **24**, с улучшениями до **32**.\n• Ванильные сторожевые башни — **2**.\n• Целые укрепления tR — **2**.\n• Прямые секции частокола tR — **8**, с улучшениями до **12**.\n• Угловые секции частокола tR — **4**.\n• Основной общий бюджет контейнеров — **8**, с улучшениями до **12**.\n\nРазные цвета одной мебели не дают отдельных лимитов. Основной бюджет объединяет несколько типов ящиков, бочек, палаток и контейнерной мебели; отдельные предметы имеют дополнительные собственные ограничения.\n\nЭлектронные кодлоки считаются отдельно: **6**, с улучшениями до **10**. Расширение радиуса не покупает новые замки автоматически.\n\n> Сначала планируй хранение и проходы, затем строй. Пустой контейнер тоже может занимать лимит.\n", "path": "Тексты_на_проверку/13_Строительство_и_лимиты.md", "later": false, "images": []}, {"title": "💥 Рейды баз", "text": "# 💥 Рейды баз\n**Основное рейд-окно: ежедневно 19:00–23:00 МСК.**\n\nГотовь инструменты, заряды и отход заранее. Перед атакой проверь тип укрепления: разные двери и материалы требуют разного подхода.\n\nВ настройках территории разрешены рейдовый ближний урон и взрывчатка; огнестрельный рейдовый урон выключен. Обычный демонтаж чужой базы не становится свободным действием.\n\n### Флаг\nВ рейд-окно посторонний может взаимодействовать с флагом для захвата у основания. Простое опускание полотнища не удаляет приват и содержимое базы автоматически.\n\n### Замки\nСобственные способы взлома электронного кодлока отключены. Мебельные замки OH используют отдельную механику и не равны дверному кодлоку.\n\n> Рейд-окно базы не является расписанием угона: взлом машин вне сейфзон доступен круглосуточно. Границы действия конкретных рейдовых инструментов администрация проверяет отдельно.\n", "path": "Тексты_на_проверку/14_Рейды.md", "later": false, "images": []}, {"title": "🔢 Кодлоки, мебель и хранение", "text": "# 🔢 Кодлоки, мебель и хранение\n**У дверей и мебели могут быть разные замки.**\n\nПосле установки замка задай код и проверь доступ снаружи и изнутри. Передавай его только доверенным людям. Членство в клане не заменяет проверку конкретного способа доступа.\n\nЭлектронные кодлоки входят в лимит территории: базово **6**, с улучшениями до **10**. Механические мебельные замки не относятся к этому счётчику.\n\n### Мебель OH\nРазмещай мебель с учётом границ привата и общего бюджета хранения. Мод поддерживает собственные замки; их спиливание ножовкой настроено на **10 минут**. Это отдельная механика от взлома электронного кодлока.\n\nРазрешены закапывание поддерживаемых бочек и установка подходящей помпы. Не все шкафы, сейфы и ячейки используют одинаковые правила открытия.\n\n> Перед выходом проверь двери, замки и продление привата. Закрытый шкаф не заменяет оплаченный срок территории.\n", "path": "Тексты_на_проверку/15_Кодлоки_и_мебель.md", "later": false, "images": []}, {"title": "💬 Чат и общение", "text": "# 💬 Чат и общение\n**Глобал — всему серверу, клановый канал — своему клану.** Локальный канал «Рядом» отключён. Серверный канал используется для объявлений.\n\nПереключай доступные каналы через интерфейс чата. Следи за выбранным каналом перед отправкой координат и планов.\n\nДоступны история, вкладки, ответы и упоминания, смайлы и реакции. Через контекстное меню сообщения можно ответить, скопировать текст или пожаловаться.\n\nВ личных настройках чата меняются размер текста, прозрачность и расположение окна. Подстрой их под свой экран.\n\n### Если возник конфликт\nИспользуй жалобу на сообщение или создай обращение с описанием ситуации. Не публикуй чужие личные данные и не засоряй общий канал повторными сообщениями.\n\n> Торгового канала отдельно нет. Возможности и ограничения конкретного окна зависят от того, какой из установленных интерфейсов чата его обслуживает.\n", "path": "Тексты_на_проверку/16_Чат.md", "later": false, "images": []}, {"title": "🏃 Автобег", "text": "# 🏃 Автобег\n**По умолчанию — Num +.** Клавишу можно переназначить в настройках управления.\n\nНажми кнопку автобега и направляй персонажа мышью. Для остановки используй кнопку переключения либо движение вперёд/назад.\n\n• Спринт разрешён, но расходует обычную выносливость.\n• При переходе в плавание автобег останавливается.\n• Попадание прерывает автобег.\n• Машина, лестница, бессознательное состояние и наручники также прерывают движение.\n\nПоведение Shift и A/D, индикатор и другие личные удобства настраиваются у игрока.\n\n> Автобег не следит за дорогой. Обрывы, вода, заражённые и вражеские игроки остаются опасными.\n", "path": "Тексты_на_проверку/17_Автобег.md", "later": false, "images": []}, {"title": "🔇 Беруши — комфортная громкость", "text": "# 🔇 Беруши — комфортная громкость\n**Приглушай громкий транспорт и окружающие звуки под себя.**\n\nОткрой настройки управления и найди действие берушей, чтобы проверить или назначить кнопку. Дополнительные параметры находятся в настройках звука.\n\nМожно выбрать ступени приглушения, отображение индикатора и поведение музыки. Сервер разрешает понижение громкости до **10%**.\n\nБеруши меняют твоё восприятие звука. Они не делают музыку или двигатель тише для окружающих игроков.\n\n> После поездки проверь индикатор: оставленное приглушение мешает услышать шаги и приближение опасности.\n", "path": "Тексты_на_проверку/18_Беруши.md", "later": false, "images": []}, {"title": "🎒 Сортировка и быстрый перенос", "text": "# 🎒 Сортировка и быстрый перенос\n**Наводи порядок по категориям и освобождай место без ручной перекладки каждой вещи.**\n\nОткрой инвентарь и используй доступные кнопки сортировки или переноса у выбранного контейнера. Перед массовым переносом проверь направление: откуда и куда уходят предметы.\n\n• Близкие контейнеры обслуживаются в пределах **3 м**.\n• Один массовый перенос — до **30 предметов**.\n• Сортировка — до **300 предметов** в контейнере.\n• Пауза сортировки — **1,5 секунды**.\n• Автоматическое объединение одинаковых предметов выключено.\n\nПоддерживаются категории оружия, боеприпасов, медицины, стройматериалов, частей мутантов и другие группы. Одежда и предметы могут поворачиваться при размещении, если это допускает контейнер.\n\n> Кнопка отмены массового переноса не является откатом любой операции с инвентарём. Сортировка не должна восприниматься как способ открыть закрытый контейнер.\n", "path": "Тексты_на_проверку/19_Сортировка_инвентаря.md", "later": false, "images": []}, {"title": "🔧 Что подходит в пустой слот", "text": "# 🔧 Что подходит в пустой слот\n**Подсказка помогает найти нужный обвес или деталь.**\n\nДважды нажми по пустому поддерживаемому слоту: откроется список совместимых предметов. Найденные у тебя вещи показываются в первую очередь.\n\nПолезно для оружейных обвесов, магазинов, батареек, оборудования, мебели и деталей транспорта.\n\nПодсказки слотов одежды и экипировки тела скрыты, чтобы не засорять интерфейс. Это не запрещает носить вещи. Такое же имя слота на манекене тоже может остаться без подсказки.\n\n> Совпадение слота означает совместимость крепления. Оно не обещает, что предмет заменяет необходимый переходник, питание или другие детали.\n", "path": "Тексты_на_проверку/20_Совместимость_обвесов.md", "later": false, "images": []}, {"title": "✨ Карточки предметов и редкость", "text": "# ✨ Карточки предметов и редкость\n**Наведи курсор на вещь, чтобы изучить состояние, описание и доступные характеристики.**\n\nНа сервере используется шесть ступеней:\n\n• Обычный.\n• Необычный.\n• Редкий.\n• Эпический.\n• Легендарный.\n• Реликвия.\n\nРедкость помогает понять место предмета в прогрессии. Она не является его ценой продажи и не означает одинаковый шанс выпадения во всех источниках.\n\nОценивай вещь по задаче: состояние, калибр, ресурс, вместимость и совместимость могут оказаться важнее красивой отметки.\n\n> Показатель защиты в карточке не описывает полностью все зоны брони, пробитие и модовые эффекты. Редкая вещь не делает владельца неуязвимым.\n", "path": "Тексты_на_проверку/21_Карточки_и_редкость.md", "later": false, "images": []}, {"title": "📻 Музыка в автомобиле", "text": "# 📻 Музыка в автомобиле\n**Кассетная магнитола работает от автомобильного аккумулятора.**\n\nВставь совместимую кассету, открой управление магнитолой и включи питание. Выбирай треки и громкость в окне устройства; водитель и пассажиры могут управлять музыкой.\n\nВ машине доступны быстрые действия стрелками: вверх/вниз — громкость, влево/вправо — треки, если назначение не изменено.\n\n• Стартовая громкость — **4 из 10**.\n• При заглушённом двигателе музыка расходует АКБ.\n• Кассеты изнашиваются примерно на **4% максимальной прочности в час**.\n• Повреждённая плёнка может «жеваться» и перескакивать.\n• Громкая музыка привлекает заражённых.\n\nЗакрытая кабина приглушает звук снаружи. В зонах тишины запуск музыки блокируется.\n\n> Настройка «Чужие магнитолы» регулирует их громкость лично для тебя. Соседи услышат источник по своим настройкам.\n", "path": "Тексты_на_проверку/22_Автомагнитола.md", "later": false, "images": []}, {"title": "🎵 Переносные магнитофоны", "text": "# 🎵 Переносные магнитофоны\n**Музыка слышна окружающим и привлекает заражённых.**\n\nПодготовь магнитофон, подходящую кассету и батарейку. Открой управление устройством, включи питание и выбери громкость.\n\nС магнитофоном на земле взаимодействуй рядом: рабочая дистанция настроена примерно на **3 м**.\n\n• Стартовая громкость — **4 из 10**.\n• Износ кассет — **4% максимальной прочности за час воспроизведения**.\n• Повреждённые кассеты могут пропускать участки записи.\n• В зонах тишины музыка выключается и не запускается.\n\nДля ремонта подходящей кассеты используй поддерживаемое действие с изолентой. Оцени оставшийся ресурс батареи перед дальней дорогой.\n\n> Громкость — часть тактики: музыка способна выдать местоположение другим выжившим.\n", "path": "Тексты_на_проверку/23_Магнитофоны.md", "later": false, "images": []}, {"title": "🎣 Рыбалка и заготовки", "text": "# 🎣 Рыбалка и заготовки\n**Рыбалка — способ добыть еду и полезный улов между вылазками.**\n\nПодготовь совместимую удочку, оснастку и наживку. У воды используй доступное действие ловли. Совместимость проверяй по слотам и описанию снасти.\n\nВ сборке включены рецепты банки, листового металла и деревянной приманки. Для конкретного рецепта используй предусмотренные игрой предметы и контекстное действие; похожая по названию деталь не всегда подходит.\n\nПосле опустошения консервов автоматическое появление пустой банки выключено — рассчитывать на бесконечное получение тары из еды не стоит.\n\nПроверяй состояние удочки и инвентарь перед ловлей. Разделывай и готовь улов подходящими инструментами, соблюдай обычную гигиену DayZ.\n\n> Точные выходы крафта и модовых заготовок уточняются по доступному действию. Этот гайд не обещает одинаковый рецепт для каждой банки или вида рыбы.\n", "path": "Тексты_на_проверку/25_Рыбалка_и_заготовки.md", "later": false, "images": []}, {"title": "🌱 Выращивание и переработка", "text": "# 🌱 Выращивание и переработка\n**Семена нужно находить. Готовая продукция требует времени и расходников.**\n\nВыращивай растение с уходом, затем используй предусмотренную для него переработку. Для коки производственная цепочка идёт через листья, пасту и дальнейший продукт; реактору нужны сырьё, реагенты и топливо.\n\nПеред запуском проверь количество, чистоту сырья, готовность оборудования и запас газа. Уход, температура и потери влияют на результат. Одна единица сырья не превращается в такую же массу готового продукта.\n\n### Боевые расходники\nРазные продукты дают разные эффекты: обезболивание и изменение выносливости сопровождаются расходом воды, толерантностью, зависимостью и отходняком. Быстрые повторные дозы повышают риск.\n\n**Обезболивание не лечит кровотечение и не возвращает потерянную кровь.** Стимуляция не гарантирует бесконечный спринт.\n\n> Сначала изучи описание конкретного сорта и продукта. Продажа, применение и производство — разные способы использования урожая.\n", "path": "Тексты_на_проверку/26_Выращивание_и_смеси.md", "later": false, "images": []}, {"title": "👁️ Мутанты и охота за трофеями", "text": "# 👁️ Мутанты и охота за трофеями\n**Мутант — не просто заражённый с большим запасом здоровья.**\n\nВ сборке есть разные семейства, включая кровососов, снорков, изломов и более тяжёлых противников. У них могут различаться скорость, специальные атаки, защита, скрытность и дистанция угрозы.\n\nПеред охотой подготовь патроны, медицинский запас и путь отхода. Изучай поведение с безопасной дистанции. Обычный нокаут от потери шока по-прежнему возможен.\n\n### Трофеи\nПосле убийства используй подходящий инструмент и доступное действие разделки. Ценность части зависит от её вида и торговых условий. Редкая часть не означает, что любая модель этого семейства гарантированно её выдаёт.\n\nДля новой цели проверь описание и сообщения игры: не всем противникам подходят одинаковые приёмы.\n\n> Не считай перечисление мутантов картой их спавна. Места и состав охраны определяются конкретной локацией или событием.\n", "path": "Тексты_на_проверку/27_Мутанты_и_трофеи.md", "later": false, "images": []}, {"title": "🌙 ПНВ и тепловое зрение", "text": "# 🌙 ПНВ и тепловое зрение\n**Подбирай прибор под условия и следи за питанием.**\n\nУстанови совместимый прибор, крепление и батарейку. Назначение включения и переключения режима проверь в настройках управления.\n\nТепловые режимы настроены на обнаружение игроков, заражённых и животных. Одежда влияет на тепловую картину, режимы отличаются дальностью и обновлением изображения.\n\nВключена поддержка работы с дымом в пределах возможностей прибора. Это не обещает одинаковое качество через любой дым, здание или препятствие.\n\nЕсли изображение ухудшается, проверь выбранный режим, питание и воздействие ярких источников. Параметры отдельных режимов могут различаться.\n\n> Прибор помогает обнаружить цель, но не определяет автоматически её принадлежность. Перед выстрелом опознай союзника.\n", "path": "Тексты_на_проверку/28_Ночное_и_тепловое_зрение.md", "later": false, "images": []}, {"title": "🪪 Жетоны и коллекции", "text": "# 🪪 Жетоны и коллекции\n**Жетон — трофей и памятная бирка персонажа.**\n\nОбычный жетон выдаётся игроку автоматически. Живой собственный жетон штатно не снимается; трофеи собираются после гибели владельца доступным игровым способом.\n\n• Базовая скупка принятого вида — **50 игровых ₽**.\n• Лимит — **3 жетона каждого принимаемого вида от продавца в сутки**.\n• Чёрная бирка ботов в эту скупку не входит.\n• Футляр стоит **1 000 ₽** и вмещает **21 жетон**.\n\nСостояние и торговые условия могут менять итоговую выплату. Красивый скин не делает жетон более дорогим автоматически.\n\n> Жетон — отдельный трофей. Он сам по себе не подтверждает место в рейтинге и не гарантирует дополнительную награду.\n", "path": "Тексты_на_проверку/29_Жетоны.md", "later": false, "images": []}, {"title": "🏆 Киллфид и рейтинг игроков", "text": "# 🏆 Киллфид и рейтинг игроков\n**Публичный киллфид показывает боевые события, рейтинг — результаты за период.**\n\nPvP-убийства и рейтинги публикуются в отдельных каналах Discord. События против заражённых, животных, самоубийства и бытовые смерти не обязаны попадать в публичный PvP-канал.\n\nВ публичном киллфиде скрыты SteamID и координаты. Видимая карточка не равна полной административной записи.\n\nСтатистические подборки настроены на публикацию в **04:00 МСК**. Для отдельных списков действуют пороги: в обычном K/D требуется от **5 убийств**, в месячном — от **20**.\n\n### Призы\nСоревновательные награды выдаются администрацией по утверждённым итогам. Автоматического расчёта всех личных и клановых номинаций нет.\n\n> Строка в таблице не означает автоматическую выдачу приза. Итоговые условия, период и допуск сверяются перед награждением.\n", "path": "Тексты_на_проверку/30_Киллфид_и_рейтинги.md", "later": false, "images": []}, {"title": "🎟️ BattlePass «Северный контракт»", "text": "# 🎟️ BattlePass «Северный контракт»\n**Выполняй задания, получай опыт и открывай уровни сезона.**\n\nПропуск содержит **30 уровней** и бесплатную ветку наград. Premium добавляет вторую ветку: он не заменяет бесплатную.\n\nОпыт начисляется за предусмотренные боевые действия, задания и события. За простое нахождение онлайн опыт пропуска не начисляется.\n\n• Дневной предел — **3 000 XP**.\n• Ежедневных заданий — **3**, еженедельных — **4**.\n• Суточный сброс — **04:00 МСК**.\n• Один бесплатный переброс задания в день.\n\nПроверяй прогресс и описание награды в интерфейсе. Перед получением подготовь место в инвентаре. Оружие, детали и расходники выдаются по составу конкретной награды, а не по одному названию картинки.\n\n**Онлайн-оплата Premium пока выключена.** Нулевая цена не является обещанием свободной автоматической активации.\n\n> Точные награды смотри в текущем сезоне: ранний скриншот или прошлый список может относиться к другой версии пропуска.\n", "path": "Тексты_на_проверку/31_BattlePass.md", "later": false, "images": []}, {"title": "🎁 Наградные кейсы", "text": "# 🎁 Наградные кейсы\n**Кейс — редкая награда за усилия с одним случайным основным исходом.**\n\nИспользуй действие открытия на полученном кейсе. Подготовь свободное место и безопасную площадку: выдача предметов зависит от состава награды, а транспорт требует места для появления.\n\nЕсть оружейные, боеприпасные, экипировочные, транспортные и другие пулы. Один и тот же тип кейса использует одинаковое содержимое независимо от того, где он получен.\n\n### Снайперское снабжение\nПодготовлены четыре варианта комплекта:\n• **40%** — зимняя маскировка.\n• **30%** — набор глушителей.\n• **20%** — дальняя оптика.\n• **10%** — ночное оснащение.\n\nИвентовый элитный кейс содержит ценные боевые варианты: оружие, оснащение, медицину и рейдовые припасы по его таблице.\n\nПовторы возможны. Защиты от дублей и счётчика гарантированного редкого выигрыша нет.\n\n> Наградные кейсы не являются платной рулеткой. Получение такого предмета не требует покупки прокрутки за реальные деньги.\n", "path": "Тексты_на_проверку/32_Наградные_кейсы.md", "later": false, "images": []}, {"title": "📨 Как обратиться к администрации", "text": "# 📨 Как обратиться к администрации\n**Одно обращение — одна понятная проблема.**\n\nОткрой систему обращений через назначенное действие в управлении. Выбери категорию, кратко назови проблему и опиши обстоятельства.\n\nУкажи:\n• Что произошло и чего ты ожидал.\n• Время и примерное место события.\n• Названия затронутых вещей или игроков.\n• Какие действия привели к проблеме.\n\nПри необходимости используй доступное прикрепление игрового контекста, списка вещей или модов. Не публикуй пароли и коды доступа.\n\nМожно держать до **3 открытых обращений**. Между новыми обращениями действует пауза **5 минут**. Своё решённое обращение можно закрыть.\n\nОтветы проверяй внутри системы. Синхронизация переписки с Discord в обе стороны сейчас не включена.\n\n> Повторный одинаковый тикет не ускоряет решение. Сам факт обращения не означает автоматической компенсации.\n", "path": "Тексты_на_проверку/33_Обращения_к_администрации.md", "later": false, "images": []}, {"title": "📦 Аирдропы Намальска", "text": "# 📦 Аирдропы Намальска\n\nПосле включения следи за предупреждениями в игре и канале аирдропов Discord. Доставку выполняет вертолёт; груз спускается к земле.\n\nПодготовлено **20 районов посадки**. Это области поиска площадки, а не гарантия появления ящика ровно на нарисованной точке.\n\n### Типы груза\n• Оружейный арсенал.\n• Боеприпасы и магазины.\n• Стройматериалы и фурнитура.\n• Броня и снаряжение.\n• Полевая медицина и рацион.\n\nПосле посадки действует **5-минутная задержка открытия**; само действие занимает **25 секунд**. Груз охраняют заражённые и мутанты, возможны дополнительные волны. Другие игроки также могут прийти к поставке.\n\nНастроенный интервал обычных доставок — **90–120 минут**, минимум **8 игроков** онлайн. Одновременно допускается один обычный активный дроп; вызывные поставки имеют отдельные условия.\n\nВызывные шашки подготовлены как награды, а не обычный товар торговца. Вызванный груз тоже объявляется другим игрокам.\n\n🗺️ На карте показаны районы возможной посадки. Положение конкретного ящика определяется событием.\n", "path": "После_включения/34_Аирдропы.md", "later": false, "images": ["Аирдропы_обзор.png"]}, {"title": "🚚 Перехват конвоя", "text": "# 🚚 Перехват конвоя\n\n**Это стоянка брошенной техники с охраной, а не колонна, едущая по маршруту.** Подготовлено **15 возможных точек** у дорог.\n\n### Чего ожидать\n• **14 охранников** в начале: заражённые и мутанты.\n• Первое подкрепление настроено с шансом **100%**.\n• До **3 волн** всего; одновременно до **22 живых охранников** события.\n• Быстрое уничтожение группы может вызвать усиленную волну.\n\n### Груз\nУ основного носителя подготовлены **2 оружейных кейса и 1 ивентовый кейс**. Носитель случайно выбирается среди охраны; ящик может появиться до полной зачистки.\n\nОставшиеся противники продолжают бой. Не считай появление контейнера сигналом безопасности. Подкрепления отдельно дополнительными кейсами не награждаются.\n\nКрасный дым сопровождает начало столкновения, зелёный — появление груза, жёлтый — активную горячую зону. Подготовлены сообщения в Discord и радиосигнал на **87,8 МГц** для подходящей рабочей рации.\n\nСобытие рассчитано на редкое появление: **4–6 часов** между попытками, от **8 игроков** онлайн.\n\n🗺️ На карте — возможные стоянки, а не все активные события одновременно.\n", "path": "После_включения/35_Конвои.md", "later": false, "images": ["Конвои_обзор.png"]}, {"title": "⚔️ ClanWar — территории и войны", "text": "# ⚔️ ClanWar — территории и войны\n\nПодготовлены **32 территории**. На карте для каждой указаны центр, радиус и доход за один часовой цикл. Сложность места, его тип и удалённость влияют на подготовленные выплаты.\n\n### Захват\nБазовое время захвата — **10 минут**. Дополнительные участники ускоряют процесс; присутствие противника может изменить ход захвата и привести к бою за зону.\n\nДоход начисляется раз в **час** при выполнении требования онлайна клана. Число на карте — выплата территории за цикл, а не награда каждому участнику.\n\n### Объявление войны\n• **10 000 ₽ + 1 000 ₽ за каждую территорию целевого клана**.\n• Подготовка — **30 минут**, длительность войны — **1 час**.\n• Цель — **15 очков**; победителю подготовлен бонус **5 000 ₽**.\n• Не более одной активной войны на клан; пауза — **48 часов**.\n• Для объявления цель должна быть онлайн, минимум участников — **2**.\n\nНастроено окно объявления войны **19:00–23:00**. Оно не обещает мгновенного завершения уже начавшейся войны ровно в 23:00.\n\n> Первоначальная зачистка нейтральной точки от мутантов как обязательное условие захвата пока не реализована. Это не встроенное правило текущего PvP-режима.\n\n🗺️ Радиусы и доходы всех зон — в интерактивной карте.\n", "path": "После_включения/36_ClanWar.md", "later": false, "images": ["ClanWar_обзор.png"]}, {"title": "🎰 Рулетка кейсов", "text": "# 🎰 Рулетка кейсов\n**Система пока выключена.** Эта памятка объясняет отличие от обычных наградных кейсов.\n\nРулетка — отдельное окно с прокрутками, собственной историей и хранилищем выигрышей. Её включение и окончательные правила будут объявлены отдельно.\n\nПока система закрыта, не рассчитывай на покупку прокрутки, ежедневную бесплатную выдачу или гарантированный редкий приз.\n\nНаградной кейс из события или BattlePass — другая механика: если предмет выдан, он открывается собственным действием и использует свой наградной пул.\n\n> Не передавай деньги другому игроку за обещание «активировать рулетку». Официальные условия появляются только в сообщении администрации.\n", "path": "После_включения/37_Рулетка.md", "later": true, "images": []}, {"title": "💠 Магазин поддержки и единый VIP", "text": "# 💠 Магазин поддержки и единый VIP\n**Покупки и платёжная система пока не запущены.**\n\nПодготовка каталога не означает, что его товары уже можно оплатить или получить. Автоматическая покупка Premium BattlePass также выключена.\n\nВ будущем планируется единая подписка, которая согласованно учитывается в чате, стартовом снаряжении, BattlePass и других поддерживающих её системах. Автоматическая связь всех этих привилегий пока не реализована.\n\nДо отдельного объявления не считай стиль ника, доступ к одному набору или Premium пропуска подтверждением всех будущих привилегий.\n\n### Вопрос по уже выданному доступу\nОбратись к администрации через тикет, укажи ник, нужную систему и суть проблемы. Не публикуй платёжные данные в общем чате.\n\n> Актуальные условия, сроки, цены и доступность объявляет администрация. Черновой каталог не является действующим предложением.\n", "path": "После_включения/38_Магазин_и_единый_VIP.md", "later": true, "images": []}, {"title": "❄️ О сервере: PvP, институт и экономика", "text": "# ❄️ Намальск — PvP, риск и борьба за добычу\n\n**Здесь снаряжение добывают, используют в бою и рискуют потерять.**\n\n### PvP и PvE — в чём разница\n**PvP** — столкновения между игроками: перестрелки, засады, борьба за груз, рейды и войны кланов.\n**PvE** — противостояние окружению: холод, голод, заражённые и мутанты. Эти угрозы дополняют PvP и заставляют готовиться к выходу.\n\n### Зачем идти в институт\nИнститут Athena — точка интереса Tier 4. Туда идут за хорошим оружием, бронёй и экипировкой SFP, понимая, что за той же добычей придут другие игроки.\n\nХорошие вещи в этой зоне — часть задуманного баланса. Качество лута оправдывает опасный маршрут и риск перестрелки. Каждый заход не гарантирует полный комплект: доступные вещи распределяются по точкам появления и общему запасу сервера.\n\n### Вокруг чего строится экономика\nОружие, одежду и обычное снаряжение преимущественно ищут в мире. Игровые рубли нужны прежде всего на транспорт, взрывчатку, услуги, строительство и развитие клана.\n\nЗарабатывать можно торговлей, продажей подходящей добычи и трофеев, а также доступными контрактами и активностями. Чистая прибыль зависит от потраченных патронов, лечения, дороги и потерь. Институт не задуман как спокойный маршрут для постоянной продажи дорогого лута.\n\n### Что даёт серверу характер\n• Холодный Намальск: тепло и запас припасов влияют на маршрут и длительность выхода.\n• Мутанты с разными атаками, трофеями и требованиями к подготовке.\n• Аирдропы и перехват охраняемой техники — повод встретиться с другими отрядами.\n• Клановые территории и войны: владения приносят доход и требуют защиты.\n• Базы, ограниченные постройки и рейды в установленное окно.\n• Торговцы, банк и рынок игроков связывают добычу, спрос и расходы.\n• Гаражи у заправок, защита машин, группы и бытовые удобства помогают готовиться к следующему выходу.\n\n**Главный выбор — чем рискнуть и за какой добычей идти: в одиночку, с напарником или всем кланом.**\n", "path": "Тексты_на_проверку/39_О_сервере.md", "later": false, "images": []}];let current=0;const $=id=>document.getElementById(id);
